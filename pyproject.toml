[project]
name = "tokens-per-watt"
version = "0.1.0"
description = "How much LLM inference speed a GPU loses as you cut its power limit, split by prefill and decode."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.8",
  "nvidia-ml-py>=12.535",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
tpw-sweep = "tpw.sweep:main"
tpw-plot = "tpw.plot:main"
tpw-demo = "tpw.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tpw"]
